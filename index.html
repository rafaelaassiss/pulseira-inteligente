<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visao Assistiva - Protótipo</title>
<style>
body{margin:0;background:#101820;color:#f5f7fa;font:16px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:18px}h1{font-size:1.5rem}button{background:#7ce0b3;border:0;border-radius:10px;padding:14px 18px;font-size:1rem;font-weight:700}button:disabled{opacity:.5}.viewer{position:relative;margin-top:16px;background:#000;border-radius:12px;overflow:hidden}video{display:block;width:100%;height:auto}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#status{margin-top:14px}#detections{line-height:1.6}small{color:#bac7d0}
</style>
</head>
<body><main>
<h1>Visão Assistiva — teste de câmera e IA</h1>
<p>Reconhecimento experimental de objetos. Não utilizar para navegação ou segurança pessoal.</p>
<button id="start">Iniciar câmera e detecção</button>
<p id="status" role="status" aria-live="polite">Aguardando início.</p>
<div class="viewer"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div>
<p id="detections" aria-live="off">Nenhum resultado ainda.</p>
<small>Requer HTTPS, permissão da câmera e internet para carregar o modelo na primeira execução. Mantenha esta página aberta.</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('overlay');
const statusEl=document.getElementById('status');
const resultsEl=document.getElementById('detections');
const start=document.getElementById('start');
let model, running=false, busy=false;
const labels={person:'pessoa',chair:'cadeira',car:'carro',bicycle:'bicicleta',dog:'cachorro',bus:'ônibus',motorcycle:'motocicleta',bench:'banco',truck:'caminhão'};
function draw(predictions){
 const w=video.videoWidth,h=video.videoHeight;
 if(!w||!h)return;
 canvas.width=w;canvas.height=h;
 const ctx=canvas.getContext('2d');
 ctx.clearRect(0,0,w,h);ctx.lineWidth=Math.max(3,w/160);ctx.font=`${Math.max(18,w/32)}px sans-serif`;
 for(const p of predictions){
  if(p.score<0.55)continue;
  const [x,y,bw,bh]=p.bbox;
  ctx.strokeStyle='#7ce0b3';ctx.fillStyle='#7ce0b3';ctx.strokeRect(x,y,bw,bh);
  const label=`${labels[p.class]||p.class} ${Math.round(p.score*100)}%`;
  const tw=ctx.measureText(label).width;
  ctx.fillRect(x,Math.max(0,y-29),tw+12,29);
  ctx.fillStyle='#101820';ctx.fillText(label,x+6,Math.max(21,y-7));
 }
}
async function loop(){
 if(!running)return;
 if(!busy && video.readyState>=2){
  busy=true;
  try{
   const predictions=(await model.detect(video)).filter(p=>p.score>=0.55);
   draw(predictions);
   resultsEl.textContent=predictions.length ? predictions.map(p=>`${labels[p.class]||p.class}: ${Math.round(p.score*100)}%`).join(' | ') : 'Nenhum objeto reconhecido neste quadro.';
  }catch(err){statusEl.textContent='Erro na detecção: '+err.message;running=false;}
  finally{busy=false;}
 }
 if(running)requestAnimationFrame(loop);
}
start.addEventListener('click',async()=>{
 start.disabled=true;
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('A câmera exige HTTPS e um navegador compatível.');
  statusEl.textContent='Solicitando acesso à câmera...';
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}}});
  video.srcObject=stream;await video.play();
  statusEl.textContent='Carregando modelo de IA (pode demorar na primeira vez)...';
  if(!window.cocoSsd)throw new Error('Biblioteca de IA não carregada. Verifique a conexão à internet.');
  model=await cocoSsd.load();
  statusEl.textContent='Câmera ativa. Detecção experimental em execução.';
  running=true;requestAnimationFrame(loop);
 }catch(err){statusEl.textContent='Não foi possível iniciar: '+err.message;start.disabled=false;}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;statusEl.textContent='Detecção pausada. Volte à página e reinicie se necessário.';}});
</script></body></html>
